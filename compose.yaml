services:
  db:
    image: postgres:17
    container_name: uniq-db
    environment:
      POSTGRES_USER: uniq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: uniq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniq -d uniq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: